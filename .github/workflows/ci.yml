name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: backend
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/**/*.trx

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/restaurant-saas-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/restaurant-saas-web/package.json

      # No package-lock.json is committed yet (this repo was generated in a sandbox whose network
      # policy blocks npm entirely, so `npm install` was never run to produce one — see the frontend
      # README). `npm ci` requires an existing lockfile, so use `npm install` until a real lockfile is
      # generated and committed; switch back to `npm ci` at that point for reproducible, faster installs.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build:prod

      - name: Test
        run: npm test -- --no-watch --no-progress --browsers=ChromeHeadless

  docker-build:
    name: Docker image build (sanity check)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/Presentation/RestaurantSaaS.Api/Dockerfile
          push: false

      - name: Build Workers image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/Workers/RestaurantSaaS.Workers/Dockerfile
          push: false

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend/restaurant-saas-web
          push: false
