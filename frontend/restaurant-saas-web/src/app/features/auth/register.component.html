<div class="auth-page">
  <mat-card class="auth-card">
    <h1>Start your free trial</h1>
    <p class="rsaas-muted">14 days, no credit card required.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Restaurant / company name</mat-label>
        <input matInput formControlName="companyName" />
      </mat-form-field>

      <div style="display:flex; gap: 0.75rem">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>First name</mat-label>
          <input matInput formControlName="firstName" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Last name</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
        <mat-hint>At least 10 characters.</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Package</mat-label>
        <mat-select formControlName="packageName">
          @for (pkg of packages; track pkg) {
            <mat-option [value]="pkg">{{ pkg }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      @if (errorMessage()) {
        <p class="error-text">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <mat-spinner diameter="20" />
        } @else {
          Create account
        }
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/auth/login">Already have an account? Sign in</a>
    </div>
  </mat-card>
</div>
