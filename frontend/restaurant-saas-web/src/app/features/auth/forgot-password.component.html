<div class="auth-page">
  <mat-card class="auth-card">
    <h1>Reset your password</h1>
    <p class="rsaas-muted">We'll email you a link to reset it.</p>

    @if (submitted()) {
      <p class="success-text">If that email exists, a reset link is on its way.</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>

        <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="form.invalid">Send reset link</button>
      </form>
    }

    <div class="auth-links">
      <a routerLink="/auth/login">Back to sign in</a>
    </div>
  </mat-card>
</div>
