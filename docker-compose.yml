name: restaurant-saas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_saas}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-restaurant_saas}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: src/Presentation/RestaurantSaaS.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      SeedDemoData: 'true'
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-restaurant_saas};Username=${POSTGRES_USER:-restaurant_saas};Password=${POSTGRES_PASSWORD:-change-me-strong-password}
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-replace-with-a-random-64-byte-base64-secret}
      Jwt__Issuer: ${JWT_ISSUER:-RestaurantSaaS}
      Jwt__Audience: ${JWT_AUDIENCE:-RestaurantSaaS.Clients}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@restaurantsaas.io}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-4200}
    ports:
      - '${API_HTTP_PORT:-5000}:8080'
    volumes:
      - api-uploads:/app/wwwroot/uploads

  worker:
    build:
      context: ./backend
      dockerfile: src/Workers/RestaurantSaaS.Workers/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-restaurant_saas};Username=${POSTGRES_USER:-restaurant_saas};Password=${POSTGRES_PASSWORD:-change-me-strong-password}
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-replace-with-a-random-64-byte-base64-secret}
      Jwt__Issuer: ${JWT_ISSUER:-RestaurantSaaS}
      Jwt__Audience: ${JWT_AUDIENCE:-RestaurantSaaS.Clients}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@restaurantsaas.io}

  web:
    build:
      context: ./frontend/restaurant-saas-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-4200}:80'

volumes:
  postgres-data:
  api-uploads:
